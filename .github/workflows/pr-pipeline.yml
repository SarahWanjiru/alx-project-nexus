name: Bild PR Pipeline

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: nexus/build

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm format --check

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm audit --audit-level=moderate

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm test -- --coverage --watchAll=false
      - uses: codecov/codecov-action@v5
        with:
          directory: ./nexus/coverage

  pwa-audit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: nexus/build
      - uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./nexus/.lighthouserc.json
