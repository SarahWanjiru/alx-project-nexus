name: Build PR Pipeline

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: true
          scopes: |
            students
            clubs
            api
            auth
            jobs
            ui
            deps
            config
            actions
            workflow

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: rm -rf node_modules pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm build
      - uses: actions/upload-artifact@v6
        with:
          name: build
          path: nexus/build

  lint: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: rm -rf node_modules pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: rm -rf node_modules pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm format:check

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: rm -rf node_modules pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm audit --audit-level=critical || true

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nexus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: nexus/pnpm-lock.yaml
      - run: rm -rf node_modules pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm list react-router-dom
      - run: ls node_modules/react-router-dom
      - run: pnpm test -- --coverage --watchAll=false
      - uses: codecov/codecov-action@v4
        with:
          directory: ./nexus/coverage
